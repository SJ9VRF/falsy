<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 350">
<rect width="1200" height="350" rx="28" fill="#0b1020"/>
<text x="42" y="54" fill="#c9b1ff" font-size="18" font-family="Inter,Arial,sans-serif">QUALITATIVE TRAJECTORY</text>
<text x="42" y="92" fill="#fff" font-size="34" font-weight="700" font-family="Inter,Arial,sans-serif">One episode: observed success, then recovery of truth</text>
<g font-family="Inter,Arial,sans-serif">
  <g transform="translate(42,130)">
    <rect width="170" height="150" rx="22" fill="#11182b" stroke="#2b3552"/>
    <text x="18" y="30" fill="#56d8ff" font-size="14">STEP 1</text>
    <text x="18" y="58" fill="#fff" font-size="22" font-weight="700">Observe</text>
    <text x="18" y="92" fill="#aab7d1" font-size="15">Candidate solves</text>
    <text x="18" y="114" fill="#aab7d1" font-size="15">the original task.</text>
  </g>
  <g transform="translate(240,130)">
    <rect width="170" height="150" rx="22" fill="#11182b" stroke="#2b3552"/>
    <text x="18" y="30" fill="#b57cff" font-size="14">STEP 2</text>
    <text x="18" y="58" fill="#fff" font-size="22" font-weight="700">Ambiguity</text>
    <text x="18" y="92" fill="#aab7d1" font-size="15">Faithful and shortcut</text>
    <text x="18" y="114" fill="#aab7d1" font-size="15">look identical.</text>
  </g>
  <g transform="translate(438,130)">
    <rect width="170" height="150" rx="22" fill="#11182b" stroke="#2b3552"/>
    <text x="18" y="30" fill="#35de87" font-size="14">STEP 3</text>
    <text x="18" y="58" fill="#fff" font-size="22" font-weight="700">Select test</text>
    <text x="18" y="92" fill="#aab7d1" font-size="15">Pick the intervention</text>
    <text x="18" y="114" fill="#aab7d1" font-size="15">with highest value.</text>
  </g>
  <g transform="translate(636,130)">
    <rect width="170" height="150" rx="22" fill="#11182b" stroke="#2b3552"/>
    <text x="18" y="30" fill="#ffd45a" font-size="14">STEP 4</text>
    <text x="18" y="58" fill="#fff" font-size="22" font-weight="700">Failure</text>
    <text x="18" y="92" fill="#aab7d1" font-size="15">Shortcut breaks on</text>
    <text x="18" y="114" fill="#aab7d1" font-size="15">the perturbed task.</text>
  </g>
  <g transform="translate(834,130)">
    <rect width="170" height="150" rx="22" fill="#11182b" stroke="#2b3552"/>
    <text x="18" y="30" fill="#ff8e55" font-size="14">STEP 5</text>
    <text x="18" y="58" fill="#fff" font-size="22" font-weight="700">Update</text>
    <text x="18" y="92" fill="#aab7d1" font-size="15">Version space shrinks.</text>
    <text x="18" y="114" fill="#aab7d1" font-size="15">Evidence is now causal.</text>
  </g>
  <g transform="translate(1032,130)">
    <rect width="126" height="150" rx="22" fill="#11182b" stroke="#2b3552"/>
    <text x="16" y="30" fill="#56d8ff" font-size="14">STEP 6</text>
    <text x="16" y="58" fill="#fff" font-size="22" font-weight="700">Reward</text>
    <text x="16" y="92" fill="#aab7d1" font-size="15">Signal now</text>
    <text x="16" y="114" fill="#aab7d1" font-size="15">prefers truth.</text>
  </g>
</g>
<g stroke="#59688a" stroke-width="3" fill="none">
  <path d="M212 205 L240 205"/>
  <path d="M410 205 L438 205"/>
  <path d="M608 205 L636 205"/>
  <path d="M806 205 L834 205"/>
  <path d="M1004 205 L1032 205"/>
</g>
</svg>