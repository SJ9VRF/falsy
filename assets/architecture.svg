<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540">
<defs>
  <linearGradient id="g1" x1="0" x2="1">
    <stop stop-color="#9b5cff"/><stop offset="1" stop-color="#56d8ff"/>
  </linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#000" flood-opacity=".35"/>
  </filter>
</defs>
<rect width="1200" height="540" rx="28" fill="#0b1020"/>
<text x="48" y="62" fill="#c9b1ff" font-size="18" font-family="Inter,Arial,sans-serif">ARCHITECTURE DIAGRAM</text>
<text x="48" y="104" fill="#ffffff" font-size="40" font-family="Inter,Arial,sans-serif" font-weight="700">Interventional Agentic Verification (IAV)</text>
<text x="48" y="136" fill="#98a8c8" font-size="18" font-family="Inter,Arial,sans-serif">Observation → hypothesis set → discriminative intervention → executable evidence → reward decision</text>

<g filter="url(#shadow)">
  <rect x="48" y="182" width="156" height="108" rx="22" fill="#10172b" stroke="#2a3552"/>
  <rect x="248" y="182" width="168" height="108" rx="22" fill="#10172b" stroke="#2a3552"/>
  <rect x="458" y="182" width="190" height="108" rx="22" fill="#10172b" stroke="#2a3552"/>
  <rect x="690" y="182" width="190" height="108" rx="22" fill="#10172b" stroke="#2a3552"/>
  <rect x="922" y="182" width="220" height="108" rx="22" fill="#10172b" stroke="#2a3552"/>
</g>

<g font-family="Inter,Arial,sans-serif">
  <text x="78" y="216" fill="#56d8ff" font-size="16">1 · Observe</text>
  <text x="78" y="248" fill="#fff" font-size="24" font-weight="700">Candidate behavior</text>
  <text x="78" y="274" fill="#9fb0cf" font-size="16">Observed task instance</text>
  <text x="78" y="296" fill="#9fb0cf" font-size="16">Observed success / output</text>

  <text x="278" y="216" fill="#b57cff" font-size="16">2 · Hypothesize</text>
  <text x="278" y="248" fill="#fff" font-size="24" font-weight="700">Version space</text>
  <text x="278" y="274" fill="#9fb0cf" font-size="16">Faithful explanation</text>
  <text x="278" y="296" fill="#9fb0cf" font-size="16">Shortcut alternatives</text>

  <text x="488" y="216" fill="#35de87" font-size="16">3 · Select</text>
  <text x="488" y="248" fill="#fff" font-size="24" font-weight="700">Intervention selector</text>
  <text x="488" y="274" fill="#9fb0cf" font-size="16">Information gain</text>
  <text x="488" y="296" fill="#9fb0cf" font-size="16">Cost-aware falsification</text>

  <text x="720" y="216" fill="#ffd45a" font-size="16">4 · Execute</text>
  <text x="720" y="248" fill="#fff" font-size="24" font-weight="700">Counterfactual executor</text>
  <text x="720" y="274" fill="#9fb0cf" font-size="16">Perturb environment</text>
  <text x="720" y="296" fill="#9fb0cf" font-size="16">Replay candidate</text>

  <text x="952" y="216" fill="#ff8e55" font-size="16">5 · Decide</text>
  <text x="952" y="248" fill="#fff" font-size="24" font-weight="700">Evidence aggregator</text>
  <text x="952" y="274" fill="#9fb0cf" font-size="16">Falsify or accept</text>
  <text x="952" y="296" fill="#9fb0cf" font-size="16">Assign reward</text>
</g>

<g stroke="url(#g1)" stroke-width="4" fill="none">
  <path d="M204 236 C220 236, 228 236, 248 236"/>
  <path d="M416 236 C432 236, 440 236, 458 236"/>
  <path d="M648 236 C664 236, 672 236, 690 236"/>
  <path d="M880 236 C896 236, 904 236, 922 236"/>
</g>

<rect x="48" y="356" width="1094" height="126" rx="24" fill="#10182b" stroke="#2a3552"/>
<text x="76" y="392" fill="#dfe7f5" font-size="24" font-family="Inter,Arial,sans-serif" font-weight="700">What is new?</text>
<text x="76" y="426" fill="#a6b5d1" font-size="18" font-family="Inter,Arial,sans-serif">
Traditional outcome or process verifiers inspect what already happened.
</text>
<text x="76" y="452" fill="#a6b5d1" font-size="18" font-family="Inter,Arial,sans-serif">
IAV actively creates new evidence by changing candidate-relevant variables and testing whether success survives.
</text>
</svg>